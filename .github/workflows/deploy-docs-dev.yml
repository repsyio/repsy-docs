name: Deploy | Repsy Docs [Dev]

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docs-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: warp-ubuntu-latest-x64-2x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Hugo and theme
        uses: ./.github/actions/setup-hugo-site

      - name: Build
        run: hugo --minify

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy public --project-name=repsy-docs-dev --branch=main
