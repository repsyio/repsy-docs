baseURL = "https://docs.repsy.io/"
languageCode = "en-us"
title = "Repsy Documentation"
theme = "hugo-theme-learn"
repo = "https://github.com/matcornic/hugo-theme-learn"

# Products are modelled as Hugo languages: `en` is Repsy Cloud (served at the root) and `os` is
# Repsy Open Source (served under /os/; the keys `os` and `product = "os"` are internal and stay).
# See AGENTS.md for the content layout and the rules for templates.
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[outputs]
home = ["HTML", "RSS", "JSON"]

[params]
  # Change default color scheme with a variant one. Can be "red", "blue", "green".
  themeVariant = "repsy"
  editURL = "https://github.com/repsyio/repsy-docs/edit/main/"
  # "Report a problem" link at the end of every page: opens a prefilled issue here.
  issuesURL = "https://github.com/repsyio/repsy-docs/issues/new"

[languages]
  [languages.en]
    languageName = "Repsy Cloud"
    languageCode = "en-us"
    weight = 1
    [languages.en.params]
      product = "cloud"
      shortName = "Cloud"
      # Site name in the <title> suffix ("<page> | Repsy Docs") and in og:site_name.
      siteName = "Repsy Docs"
  [languages.os]
    languageName = "Repsy Open Source"
    languageCode = "en-us"
    weight = 2
    [languages.os.params]
      product = "os"
      shortName = "Open Source"
      siteName = "Repsy Open Source"
      # Header badge label on narrow screens, where "Open Source" does not fit next to the logo.
      compactName = "OSS"
      # The Repsy Open Source release the docs are written for, e.g. "26.10.0". Empty until the release is
      # known: while it is empty nothing is shown (header badge, home page) and `{{< os-version >}}` renders nothing.
      version = ""

# content/ is Cloud only, content-os/ is Repsy OS only, shared/ is mounted into both languages.
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
    lang = "en"
  [[module.mounts]]
    source = "shared"
    target = "content"
    lang = "en"
  [[module.mounts]]
    source = "content-os"
    target = "content"
    lang = "os"
  [[module.mounts]]
    source = "shared"
    target = "content"
    lang = "os"

# Hugo enables its embedded link and image render hooks on sites that define languages, which would
# rewrite the relative links in the existing Cloud pages (`../../maven/` becomes `/maven/`). Keep the
# links as written so the Cloud output stays identical.
[markup.goldmark.renderHooks.link]
  enableDefault = false
[markup.goldmark.renderHooks.image]
  enableDefault = false
